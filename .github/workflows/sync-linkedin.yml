name: Sync LinkedIn → About page

# Regenerates src/cv.data.json from the LinkedIn PDF whenever you commit a new
# export. The commit it pushes back to `main` triggers the normal Pages deploy,
# so the live About page updates with no extra steps.
#
# Your effort end-to-end:
#   LinkedIn → "Save to PDF" → replace sources/linkedin-profile.pdf → commit.
on:
  push:
    branches: [main]
    paths:
      - 'sources/linkedin-profile.pdf'
      - 'scripts/sync-linkedin.mjs'
  # Manual run (e.g. after editing the parser) from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-linkedin
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync from LinkedIn PDF
        run: npm run sync:linkedin

      - name: Commit refreshed CV data
        run: |
          if git diff --quiet -- src/cv.data.json; then
            echo "cv.data.json is already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cv.data.json
          git commit -m "chore: sync About page from LinkedIn PDF"
          git push
